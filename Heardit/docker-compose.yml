services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # The app reads configuration from environment variables (double-underscore = nested key).
      ConnectionStrings__HearditDbContextConnection: "Host=db;Port=5432;Database=heardit;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Spotify__ClientId: "${Spotify__ClientId}"
      Spotify__ClientSecret: "${Spotify__ClientSecret}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: heardit
    volumes:
      - heardit-pgdata:/var/lib/postgresql/data
    # No host port is published: the app reaches Postgres over the compose network as `db`,
    # so this coexists with the standalone `heardit-pg` dev container on host port 5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d heardit"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  heardit-pgdata:
